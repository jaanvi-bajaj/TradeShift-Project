# Run all tests and style checks on every push and pull request (Week 3, GitHub Actions).
#
# Packages come from the wheel bundle attached to the GitHub release, installed with
# --no-index, so CI uses exactly the versions the servers use.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  WHEELHOUSE_URL: https://github.com/${{ github.repository }}/releases/download/deps-py311-v1/wheelhouse-py311-x86_64.tar.gz

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned packages from the release wheel bundle
        run: |
          curl -fsSL -o /tmp/wheelhouse.tar.gz "$WHEELHOUSE_URL"
          mkdir -p /tmp/wheelhouse && tar -xzf /tmp/wheelhouse.tar.gz -C /tmp/wheelhouse
          python -m pip install --no-index --find-links /tmp/wheelhouse -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Unit and pipeline tests (pytest)
        run: pytest -q
